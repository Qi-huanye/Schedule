name: Publish Android release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Check version tag
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = re.search(r'versionName = "([^"]+)"', pathlib.Path('app/build.gradle.kts').read_text()).group(1)
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match versionName'
          PY
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SCHEDULE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/schedule-signing.jks"
          chmod 600 "$RUNNER_TEMP/schedule-signing.jks"
      - name: Verify and build signed release
        env:
          SCHEDULE_KEYSTORE_PATH: ${{ runner.temp }}/schedule-signing.jks
          SCHEDULE_KEYSTORE_PASSWORD: ${{ secrets.SCHEDULE_KEYSTORE_PASSWORD }}
          SCHEDULE_KEY_ALIAS: ${{ secrets.SCHEDULE_KEY_ALIAS }}
          SCHEDULE_KEY_PASSWORD: ${{ secrets.SCHEDULE_KEY_PASSWORD }}
        run: |
          scripts/package-release.sh
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose release/Schedule-*.apk
      - name: Publish APK and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/Schedule-*.apk release/SHA256SUMS.txt \
            --verify-tag --title "Schedule $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/schedule-signing.jks"
